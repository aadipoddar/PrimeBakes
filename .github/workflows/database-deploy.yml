name: Deploy Database

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  version-check:
    uses: ./.github/workflows/version-checks.yml

  deploy-database:
    runs-on: windows-latest
    needs: version-check
    if: needs.version-check.outputs.should-deploy == 'true'

    steps:
    - uses: actions/checkout@v5

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build SQL Server Database Project
      run: msbuild Data/PrimeBakes.Database/PrimeBakes.Database.sqlproj /p:Configuration=Release /p:Platform="Any CPU"

    - name: Find DACPAC file
      run: |
        Get-ChildItem -Path "Data/PrimeBakes.Database" -Filter "*.dacpac" -Recurse | Select-Object FullName

    - name: Install SqlPackage
      run: |
        Invoke-WebRequest -Uri "https://aka.ms/sqlpackage-windows" -OutFile "SqlPackage.zip"
        Expand-Archive -Path "SqlPackage.zip" -DestinationPath "SqlPackage"

    - name: Deploy Database to Azure SQL
      run: |
        $dacpacPath = (Get-ChildItem -Path "Data/PrimeBakes.Database" -Filter "PrimeBakes.Database.dacpac" -Recurse).FullName
        echo "Using DACPAC: $dacpacPath"
        ./SqlPackage/SqlPackage.exe /Action:Publish `
          /SourceFile:"$dacpacPath" `
          /TargetConnectionString:"${{ secrets.AzureConnectionString }}" `
          /p:IncludeCompositeObjects=True `
          /p:IgnoreTableOptions=True

    - name: Deploy Database to Azure SQL Testing
      run: |
        $dacpacPath = (Get-ChildItem -Path "Data/PrimeBakes.Database" -Filter "PrimeBakes.Database.dacpac" -Recurse).FullName
        echo "Using DACPAC: $dacpacPath"
        ./SqlPackage/SqlPackage.exe /Action:Publish `
          /SourceFile:"$dacpacPath" `
          /TargetConnectionString:"${{ secrets.AzureTestingConnectionString }}" `
          /p:IncludeCompositeObjects=True `
          /p:IgnoreTableOptions=True

    - name: Deployment Summary
      run: |
        echo "🚀 Successfully deployed PrimeBakes database version ${{ needs.version-check.outputs.current-version }} to Azure SQL and Azure SQL Testing"
