name: Deploy Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  version-check:
    uses: ./.github/workflows/version-checks.yml

  build:
    runs-on: windows-latest
    needs: version-check
    if: needs.version-check.outputs.should-deploy == 'true'

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install .NET MAUI Workload
      run: dotnet workload install maui --skip-sign-check

    - name: Create Secrets.local_secrets.cs
      run: |
        $secretsContent = @'
        namespace PrimeBakes.Data.DataAccess;

        public static partial class Secrets
        {
            static Secrets()
            {
                AzureConnectionString = "${{ secrets.AzureConnectionString }}";
                AzureTestingConnectionString = "${{ secrets.AzureTestingConnectionString }}";

                AzureBlobStorageConnectionString = "${{ secrets.AzureBlobStorageConnectionString }}";
                AzureBlobStorageAccountKey = "${{ secrets.AzureBlobStorageAccountKey }}";

                JwtKey = "${{ secrets.JwtKey }}";
                GoogleMapsApiKey = "${{ secrets.GoogleMapsApiKey }}";
                WebPushPrivateKey = "${{ secrets.WebPushPrivateKey }}";

                EmailPassword = "${{ secrets.EmailPassword }}";
            }
        }
        '@
        Set-Content -Path "Data/PrimeBakes.Data/DataAccess/Secrets.local_secrets.cs" -Value $secretsContent

    - name: Create CommonSecrets.local_secrets.cs
      run: |
        $commonSecretsContent = @'
        namespace PrimeBakes.Models.DataAccess;

        public static partial class CommonSecrets
        {
            static CommonSecrets()
            {
                SyncfusionLicense = "${{ secrets.SyncfusionLicense }}";

                NotificationAPIKey = "${{ secrets.NotificationAPIKey }}";
                NotificationBackendServiceEndpoint = "${{ secrets.NotificationBackendServiceEndpoint }}";

                GoogleMapsBrowserKey = "${{ secrets.GoogleMapsBrowserKey }}";

                WebPushPublicKey = "${{ secrets.WebPushPublicKey }}";
            }
        }
        '@
        Set-Content -Path "Data/PrimeBakes.Models/DataAccess/CommonSecrets.local_secrets.cs" -Value $commonSecretsContent

    - name: Setup Keystore
      run: |
        # Decode base64 keystore and save it
        $keystoreBase64 = "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
        $keystoreBytes = [System.Convert]::FromBase64String($keystoreBase64)
        $keystorePath = "App/PrimeBakes/primebakes.keystore"
        [System.IO.File]::WriteAllBytes($keystorePath, $keystoreBytes)
        echo "Keystore created at: $keystorePath"

    - name: Point PrimeBakes.Shared at PrimeBakes.Data
      run: |
        $path = "App/PrimeBakes.Shared/PrimeBakes.Shared.csproj"
        $old = '<ProjectReference Include="..\..\Api\PrimeBakes.Api.Client\PrimeBakes.Api.Client.csproj" />'
        $new = '<ProjectReference Include="..\..\Data\PrimeBakes.Data\PrimeBakes.Data.csproj" />'
        $content = Get-Content -Path $path -Raw
        Set-Content -Path $path -Value $content.Replace($old, $new) -NoNewline

    - name: Restore dependencies
      run: dotnet restore App/PrimeBakes/PrimeBakes.csproj

    - name: Build Signed Android APK
      run: |
        dotnet publish App/PrimeBakes/PrimeBakes.csproj `
          -f net10.0-android `
          -c Release `
          -p:AndroidPackageFormat=apk `
          -p:AndroidKeyStore=true `
          -p:AndroidSigningKeyStore=primebakes.keystore `
          -p:AndroidSigningKeyAlias=PrimeBakes `
          -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" `
          -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" `
          -o App/PrimeBakes/publish/android

    - name: Find and Rename APK
      id: find-apk
      run: |
        $apkPath = Get-ChildItem -Path "App/PrimeBakes/publish/android" -Filter "*.apk" -Recurse | Select-Object -First 1 -ExpandProperty FullName
        echo "APK found at: $apkPath"

        # Rename to match UpdateManager expectations: PrimeBakes.apk
        Copy-Item $apkPath -Destination "PrimeBakes.apk"
        echo "APK renamed to: PrimeBakes.apk"

    - name: Upload Android Build Artifact
      uses: actions/upload-artifact@v5
      with:
        name: android-release
        path: PrimeBakes.apk

  deploy:
    runs-on: windows-latest
    needs: [version-check, build]
    if: needs.version-check.outputs.should-deploy == 'true'
    permissions:
      contents: write

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v5
      with:
        name: android-release

    - name: Upload APK to Existing Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version-check.outputs.current-version }}
        files: PrimeBakes.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Deployment Summary
      run: |
        echo "🚀 Successfully deployed PrimeBakes Android APK to release ${{ needs.version-check.outputs.current-version }}"
