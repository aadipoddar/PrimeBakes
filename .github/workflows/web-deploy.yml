name: Deploy Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  version-check:
    uses: ./.github/workflows/version-checks.yml

  build:
    runs-on: ubuntu-latest
    needs: version-check
    if: needs.version-check.outputs.should-deploy == 'true'
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Create CommonSecrets.local_secrets.cs
        run: |
          $commonSecretsContent = @'
          namespace PrimeBakes.Models.DataAccess;

          public static partial class CommonSecrets
          {
              static CommonSecrets()
              {
                  SyncfusionLicense = "${{ secrets.SyncfusionLicense }}";

                  NotificationAPIKey = "${{ secrets.NotificationAPIKey }}";
                  NotificationBackendServiceEndpoint = "${{ secrets.NotificationBackendServiceEndpoint }}";
              }
          }
          '@
          Set-Content -Path "Data/PrimeBakes.Models/DataAccess/CommonSecrets.local_secrets.cs" -Value $commonSecretsContent
        shell: pwsh

      - name: Publish PrimeBakes.Web
        run: dotnet publish App/PrimeBakes.Web/PrimeBakes.Web.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v5
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: [version-check, build]
    if: needs.version-check.outputs.should-deploy == 'true'

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v5
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'primebakes'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZURE_WEB_APP_PUBLISH_PROFILE }}

      - name: Deployment Summary
        run: |
          echo "🚀 Successfully deployed PrimeBakes version ${{ needs.version-check.outputs.current-version }} to Azure"
